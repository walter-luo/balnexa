# Balnexa CI (S4 INS-1, partial): secret scan + the full database and API test suites on PostgreSQL 16 and 17 (PGDG builds,
# with pg_dump/pg_restore of the same major). Synthetic data only; no secrets, no cloud resources, no deployment.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Owner-private sources are never committed
        run: |
          if git log --all --name-only --format= | grep -i 'owner_sources'; then
            echo "::error::a path under owner_sources is in the history"; exit 1
          fi
      - name: SIN/ITN candidates in tracked files and history (guard C6, Addendum A1 Rev 1)
        run: python3 tools/s4/sin_repo_scan.py --all-history
      - name: release manifest (INS-1; deploy rule, N-1 range, immutable migrations)
        run: python3 tools/s4/release_manifest.py --check
      - name: release files and signature (INS-1; the signature gate is at install, --require-signed; here it is reported)
        run: |
          python3 tools/s4/release_sign.py check-files
          python3 tools/s4/release_sign.py verify || true
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 git /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose --exit-code 1

  db-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pg: ['16', '17']
    env:
      BNX_SERVER: pg${{ matrix.pg }}
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL 16 and 17 from PGDG
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-16 postgresql-17
          sudo systemctl stop postgresql || true
      - name: Start the test cluster (socket and port expected by tests/py/harness.py)
        run: |
          V=${{ matrix.pg }}; D=/var/lib/postgresql/ci$V; S=/var/lib/postgresql/bnx$V
          sudo install -d -o postgres -g postgres -m 0755 "$D" "$S"
          sudo -u postgres /usr/lib/postgresql/$V/bin/initdb -D "$D/data" -U postgres --auth=trust -E UTF8 --locale=C.UTF-8 > /dev/null
          sudo -u postgres /usr/lib/postgresql/$V/bin/pg_ctl -D "$D/data" -o "-p 554$V -k $S -c listen_addresses=" -l "$D/server.log" -w start
          psql "host=$S port=554$V user=postgres dbname=postgres" -Atc 'select version()'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "psycopg[binary]==3.2.3"
      - name: Executor validator dependencies (9011c; PyPI with hashes, OCR engine and strace from Ubuntu)
        run: |
          pip install --require-hashes --only-binary=:all: -r apps/executor/requirements.txt
          sudo apt-get install -y -q tesseract-ocr tesseract-ocr-eng strace age
          tesseract --version | head -1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
        working-directory: apps/worker
      - name: R1 suite and S4 suites
        run: |
          set -o pipefail          # a failing suite must fail the job through | tee (found in CORE-8: the default shell has no pipefail)
          mkdir -p ci-evidence
          rc=0                     # every suite runs; the step fails if any failed
          python tests/py/run_g0.py --server "$BNX_SERVER" --evidence ci-evidence/run_g0 | tee ci-evidence/run_g0.txt || rc=1
          for f in tests/py/run_s4_core*.py; do
            n=$(basename "$f" .py)
            python "$f" --server "$BNX_SERVER" --evidence "ci-evidence/$n" | tee "ci-evidence/$n.txt" || rc=1
          done
          exit $rc
      - name: Black-box API
        run: BNX_PY="$(which python)" node --test tests/blackbox/api.test.mjs tests/blackbox/unit.test.mjs
      - name: PWA headless suite (CORE-9; all AI routes and other hosts blocked)
        working-directory: tests/pwa
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          BNX_SERVER="$BNX_SERVER" BNX_PY="$(which python)" node --test --test-concurrency=1 pwa.test.mjs
      - name: Dispatch simulation
        if: matrix.pg == '16'
        run: node tests/sim/dispatch_sim.mjs
      - name: Server log on failure
        if: failure()
        run: sudo tail -n 200 /var/lib/postgresql/ci${{ matrix.pg }}/server.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-pg${{ matrix.pg }}
          path: |
            ci-evidence
            !ci-evidence/**/*.dump
          retention-days: 30

  executor-image:
    # M0-A preparation: the Executor image builds, and its tools and package are present (nothing is pushed or deployed)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: docker build -f apps/executor/Dockerfile -t bnx-exec:ci .
      - name: smoke (tools and package; no credentials, no network calls)
        run: |
          docker run --rm --entrypoint sh bnx-exec:ci -c '
            set -e
            /usr/lib/postgresql/16/bin/pg_dump --version; /usr/lib/postgresql/17/bin/pg_restore --version
            age --version; tesseract --version | head -1
            python -c "import bnx_exec.jobs as j, bnx_exec.sin_detector as s; print(sorted(j.JOBS)); print(s.VERSION)"
            id -u'
          rc=0; docker run --rm bnx-exec:ci run --kind DOC_PROCESS || rc=$?
          test "$rc" -eq 2                                                     # configuration error: no gateway configured
