name: Wrongly refused (SIN or card-number guard)
description: A guard refused ordinary data (SIN_CANDIDATE or PAN_CANDIDATE) that is not a SIN or a card number.
title: "[Refused] "
labels: ["type:false-refusal", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        The guards refuse on purpose when in doubt (fail closed). Reports like this one let the Owner tune them in a later release.
        **Do not paste the refused number, not even partly.** Describe its shape only.
  - type: input
    id: release
    attributes:
      label: Release
      description: "Settings → Version, or `release` in `/app/config.json`."
      placeholder: "V1.0-R02"
    validations:
      required: true
  - type: dropdown
    id: code
    attributes:
      label: Error code
      options:
        - PAN_CANDIDATE
        - SIN_CANDIDATE
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: The screen or command, and the field (for example "Import plan, item description").
    validations:
      required: true
  - type: input
    id: shape
    attributes:
      label: Shape of the refused value
      description: Number of digits, grouping and the characters around it, for example "16 digits grouped 4-4-4-4 after the word Ref".
    validations:
      required: true
  - type: input
    id: what
    attributes:
      label: What the value really is
      description: For example "an e-Transfer reference", "a loyalty number", "an order number".
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Where such values come from (optional)
      description: The kind of document or institution, for example "bank statement transaction column". No names of people.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I did not paste the value or any part of it.
          required: true
